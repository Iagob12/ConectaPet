name: Monitorar API no Azure

on:
  push:
    branches: [main]
    paths: [.github/workflows/manter-api-ativa.yml]
  schedule:
    # A VM nao hiberna. Esta sonda apenas detecta se API e banco deixarem de
    # responder, em minutos fora da virada da hora para evitar filas do GitHub.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitorar-api-azure
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir API e banco
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            https://api.68-211-146-157.sslip.io/healthz
