# API no Render, a partir do Dockerfile.
#
# Render → New → Blueprint → aponte para este repositório. Ele lê este arquivo
# e cria o serviço; as variáveis marcadas `sync: false` ele pergunta na hora,
# para nenhum segredo ficar versionado.
#
# O banco NÃO está aqui: o Render só oferece PostgreSQL gerenciado, e este
# projeto é MySQL. Aponte BANCO_URL para o MySQL de onde ele estiver.

services:
  - type: web
    name: conectapet-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # O Render nao tem regiao na America do Sul. Ohio e a menos ruim: fica a
    # uns 120 ms de Sao Paulo, contra ~180 ms de Oregon.
    #
    # Isso enfraquece em parte a escolha de por o site em gru1: a pagina de
    # resgate renderiza no Brasil, mas faz uma chamada a API do outro
    # hemisferio antes de responder. Se a lentidao incomodar em campo, o
    # caminho e mover a API para um provedor com regiao brasileira — o
    # Dockerfile e o mesmo, e nada no codigo prende ao Render.
    region: ohio
    # ATENÇÃO: gratuito, e isto é TEMPORÁRIO.
    #
    # Serve para validar a pilha inteira sem custo. Ele hiberna após 15 min sem
    # tráfego e leva ~50 s para acordar — e nesse tempo quem encostou o celular
    # na tag lê "nossos servidores não responderam".
    #
    # TROQUE PARA `starter` ANTES DE ENTREGAR A PRIMEIRA TAG. Vender um produto
    # de resgate cuja página demora 50 s para abrir é pior do que não vender.
    plan: free
    healthCheckPath: /actuator/health

    envVars:
      # ---- Banco (externo ao Render) ----
      - key: BANCO_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false

      # ---- Segredos ----
      # generateValue faz o Render sortear um valor forte na criação e guardá-lo.
      # Melhor do que colar um segredo que já passou por um chat ou um e-mail.
      - key: JWT_SEGREDO
        generateValue: true
      - key: IP_PIMENTA
        generateValue: true

      # ---- Endereços ----
      # A aplicação recusa subir se qualquer um apontar para localhost.
      #
      # Estes três ficam versionados, com valor, e não `sync: false`. Não são
      # segredos — são endereços públicos — e versioná-los tem duas vantagens
      # concretas:
      #
      #   1. O painel do Render mascara TODOS os valores ao editar. Corrigir um
      #      endereço por lá significa salvar um formulário onde MYSQL_PASSWORD,
      #      JWT_SEGREDO e IP_PIMENTA aparecem vazios — e salvar apaga os três.
      #      Pelo blueprint, só as chaves declaradas aqui são tocadas.
      #   2. CORS_ORIGENS errado não gera erro em lugar nenhum: o navegador
      #      bloqueia a confirmação de leitura e o tutor nunca é avisado. Uma
      #      linha revisável no repositório é melhor do que um campo de painel
      #      que ninguém relê.
      #
      # Domínio provisório da Vercel. Ao migrar para domínio próprio, troque os
      # três aqui — e lembre que URL_PUBLICA_TAG já gravada em chip não volta
      # atrás: tag em campo continua apontando para o endereço antigo.
      - key: URL_PUBLICA_TAG
        value: https://conecta-pet-inky.vercel.app/p/
      - key: URL_SITE
        value: https://conecta-pet-inky.vercel.app
      - key: CORS_ORIGENS
        value: https://conecta-pet-inky.vercel.app

      # ---- Proxies a frente da aplicacao ----
      # TRES, e o numero saiu de medicao, nao de palpite. O diagnostico
      # registrou a cadeia real:
      #
      #   sem cabecalho forjado:  177.16.x.x | 172.71.x.x | 10.30.x.x (priv)
      #   com um forjado na frente: 7.7.x.x | 177.16.x.x | 172.71.x.x | 10.30.x.x
      #
      # 177.16.x.x e o cliente. 172.71.x.x e a Cloudflare, que fica na frente do
      # Render. 10.30.x.x e interno do Render. Sao dois saltos depois do
      # cliente, e o do meio e PUBLICO — foi ele que a varredura automatica
      # pegava, e como o IP de borda da Cloudflare muda a cada requisicao, o
      # limite por IP ficava erratico.
      #
      # Se um dia o limite voltar a nao morder, o numero aqui e o primeiro
      # suspeito: ligue DIAGNOSTICO_PROXY e leia a cadeia de novo, em vez de
      # tentar outro numero no escuro.
      - key: PROXIES_CONFIAVEIS
        value: "3"

      # ---- Diagnostico de proxy ----
      # DESLIGADO. Ja cumpriu o papel: a cadeia esta documentada acima.
      # Ligar de novo custa uma linha de log por requisicao.
      - key: DIAGNOSTICO_PROXY
        value: "false"

      # ---- Primeiro administrador ----
      # Cadastre-se pelo site, ponha o e-mail aqui e reinicie o serviço.
      - key: ADMIN_EMAIL
        sync: false

      # ---- E-mail ----
      # "http", e nao "smtp", por uma restricao da hospedagem e nao por
      # preferencia: o plano gratuito do Render bloqueia as portas 25, 465 e
      # 587 desde setembro de 2025, e a conexao SMTP expira sem dizer o motivo.
      # A porta 443 passa.
      #
      # Se um dia o servico virar pago, "smtp" volta a funcionar e as variaveis
      # SMTP_* abaixo ja estao prontas. Nao ha motivo para voltar, exceto
      # preferencia.
      # AINDA "log": trocar para "http" e o ultimo passo, depois que
      # EMAIL_HTTP_CHAVE existir no grupo de ambiente. Com "http" e a chave
      # vazia a aplicacao recusa subir — de proposito — e o deploy falharia
      # sem necessidade.
      - key: EMAIL_PROVEDOR
        value: log

      # Brevo: 300 e-mails por dia no plano gratuito. Escolhido por aceitar
      # verificar um endereco @gmail.com como remetente, sem dominio proprio —
      # o Resend, por comparacao, so entrega para o dono da conta ate haver
      # dominio verificado, o que nao serve para avisar tutores.
      #
      # A chave de API fica no grupo de ambiente, nao aqui.
      - key: EMAIL_HTTP_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: EMAIL_HTTP_CHAVE
        sync: false

      # O remetente precisa estar VERIFICADO no Brevo, senao ele recusa com
      # "sender not valid" — e esse texto agora aparece no log, junto da falha.
      - key: EMAIL_REMETENTE
        value: "ConectaPet <conectapet.contato@gmail.com>"

      # ---- SMTP (inativo enquanto EMAIL_PROVEDOR=http) ----
      # Ficam declarados para a troca ser so mudar EMAIL_PROVEDOR, caso o
      # servico vire pago. SMTP_SENHA continua no grupo de ambiente.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORTA
        value: "587"
      - key: SMTP_USUARIO
        value: conectapet.contato@gmail.com
      - key: SMTP_SENHA
        sync: false

      # ---- Fotos ----
      # ATENÇÃO: "local", e isto é TEMPORÁRIO.
      #
      # No Render o disco do container é efêmero: com "local", TODA FOTO DE PET
      # SOME a cada deploy. Está assim só para a pilha subir antes de o bucket
      # existir — com "s3" e as chaves em branco, a aplicação nem inicia.
      #
      # TROQUE PARA `s3` ASSIM QUE O BUCKET EXISTIR. A foto é o que faz quem
      # achou o pet reconhecer o bicho; perdê-la não é perder um enfeite.
      - key: FOTO_ARMAZENAMENTO
        value: local
      - key: FOTO_S3_BUCKET
        sync: false
      - key: FOTO_S3_ENDPOINT
        sync: false
      - key: FOTO_S3_REGIAO
        value: auto
      - key: FOTO_S3_CHAVE
        sync: false
      - key: FOTO_S3_SEGREDO
        sync: false
