spring:
  application:
    name: conectapet-api

  # Só é usado quando conectapet.email.provedor=smtp. Sem isso definido, o
  # starter-mail fica no classpath sem fazer nada.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORTA:587}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      # Falha rápido: a fila reprocessa com espera crescente, e uma conexão
      # pendurada travaria o lote inteiro de notificações.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  datasource:
    url: ${BANCO_URL:jdbc:mysql://localhost:3306/conectapet}
    username: ${MYSQL_USER:conectapet}
    password: ${MYSQL_PASSWORD:senha-local}

  jpa:
    # Nunca "update". O esquema e responsabilidade exclusiva do Flyway;
    # "validate" faz a aplicacao morrer cedo se entidade e tabela divergirem.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null   # campo oculto some do JSON em vez de virar null

  servlet:
    multipart:
      # Acompanha conectapet.foto.max-bytes, com folga para o envelope do
      # multipart. Se o Tomcat cortar antes, quem recusa e o container e a
      # mensagem que chega ao tutor deixa de ser a nossa.
      max-file-size: ${FOTO_MAX_BYTES:4194304}
      max-request-size: 5MB

server:
  error:
    include-message: never
    include-stacktrace: never
  # DESLIGADO de proposito. Ligado, o ForwardedHeaderFilter do Spring faz duas
  # coisas ruins aqui: assume o IP da PRIMEIRA entrada do X-Forwarded-For — que
  # e escrita pelo cliente, nao pelo proxy — e depois remove o cabecalho, de
  # modo que nem da para corrigir depois. Quem resolve o IP e o IpDoCliente,
  # que le a ultima entrada. Nada mais aqui depende de scheme ou host
  # encaminhado: a API nao emite redirect e o Secure do cookie e explicito.
  forward-headers-strategy: none

# Sonda de saude, e so ela. O actuator expoe muita coisa por padrao — metricas,
# variaveis de ambiente, mapeamentos — e nada disso precisa estar de pe para o
# orquestrador saber se a aplicacao responde.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Sem detalhe: "UP" basta para o healthcheck, e o detalhe diria a quem
      # sondar de fora qual banco esta atras e se ele esta fora do ar.
      show-details: never
  health:
    mail:
      # Desligado de proposito. A sonda responde "esta instancia consegue
      # atender?", e nao "toda integracao opcional esta no ar". Com o provedor
      # de e-mail ausente — que e o padrao — o indicador tenta conectar num
      # SMTP vazio e derruba a saude inteira: o container nunca ficaria
      # saudavel, o balanceador nao mandaria trafego, e a pagina de resgate
      # ficaria fora do ar por causa de uma notificacao que nem e sincrona.
      # Falha de envio ja e tratada na fila, com nova tentativa.
      enabled: false

conectapet:
  jwt:
    segredo: ${JWT_SEGREDO}
    duracao-acesso: PT15M
    duracao-refresh: P30D
    # Duas abas renovando ao mesmo tempo derrubariam a sessao de um usuario
    # legitimo sem esta janela: a segunda apresentaria um token ja rotacionado.
    tolerancia-rotacao: PT10S
  privacidade:
    # Quantos proxies existem entre a internet e esta aplicacao. Define qual
    # entrada do X-Forwarded-For e confiavel: a ultima menos (n-1).
    #
    # 1 no Render, na Vercel e atras do Caddy do docker-compose. Use 0 para
    # execucao direta, sem proxy nenhum na frente.
    #
    # Errar para MAIS e uma falha de seguranca: passa a confiar numa entrada
    # que o cliente escreve, e todo limite por IP volta a ser contornavel.
    proxies-confiaveis: ${PROXIES_CONFIAVEIS:1}
    ip-pimenta: ${IP_PIMENTA}
  site:
    # Base dos links que saem por e-mail. Errado aqui, o link de redefinir
    # senha chega ao cliente apontando para lugar nenhum.
    url: ${URL_SITE:https://conectapet.com.br}
  email:
    # "log" registra no console; "smtp" envia de verdade. O padrao e log de
    # proposito: um ambiente que herdasse SMTP por engano mandaria "alguem
    # leu a tag do seu pet" para cliente de verdade.
    provedor: ${EMAIL_PROVEDOR:log}
    remetente: ${EMAIL_REMETENTE:ConectaPet <nao-responda@conectapet.com.br>}
    # Para onde vai a resposta de quem apertar "responder". Vazio desliga.
    responder-para: ${EMAIL_RESPONDER_PARA:}
  reset-senha:
    # Curto: e um passe de entrada na conta viajando por e-mail.
    validade: PT1H
  verificacao-email:
    # Mais longo que o reset: nao da acesso a nada, so confirma o endereco, e
    # e comum a pessoa so abrir a caixa de entrada no dia seguinte.
    validade: P2D
  tag:
    url-publica: ${URL_PUBLICA_TAG:https://conectapet.com.br/p/}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:4321}
  planos:
    # Plus vencido nao esconde contato: o teto so bloqueia ADICIONAR mais.
    # O numero do Plus veio como [X] na copy e segue pendente de dado real.
    free:
      teto-contatos: 1
    plus:
      teto-contatos: 5
  limites:
    # Piso de tempo das rotas publicas de tag. Sem ele, a diferenca de latencia
    # entre "existe" e "nao existe" reintroduz a enumeracao que os dois codigos
    # existem para impedir.
    piso-resposta-publica: PT0.12S
    reivindicacao-por-ip: 5
    reivindicacao-por-codigo: 5
    reivindicacao-janela: PT1H
    # Adivinhacao de senha. Por conta e apertado (e o ataque que importa); por
    # IP e largo, porque operadora movel compartilha endereco entre assinantes.
    login-por-conta: 10
    login-por-ip: 30
    login-janela: PT15M
    # Chave IP + codigo, nao so IP: CGNAT de operadora movel compartilha
    # endereco entre muitos assinantes.
    leitura-publica-por-minuto: 30
    registro-leitura-por-minuto: 10
    lista-espera-por-hora: 5
  leitura:
    # Aproximacoes repetidas do mesmo celular nao viram uma enxurrada de push.
    janela-dedup: PT10M
  retencao:
    # Coordenada, mensagem e telefone de quem encontrou: dado de terceiro que so
    # quis ajudar. Sai antes do resto.
    dados-de-terceiro: P90D
    leitura: P365D
    cron: "0 30 3 * * *"
  foto:
    # "local" grava em disco e NAO sobrevive a redeploy; "s3" usa object
    # storage — S3, R2, MinIO, Backblaze. O bucket nunca e publico: os bytes
    # voltam para a API, que os serve sob a regra de visibilidade do perfil.
    armazenamento: ${FOTO_ARMAZENAMENTO:local}
    diretorio: ${FOTO_DIRETORIO:./dados/fotos}
    # 4 MB, e nao 5. O upload passa pelo servidor do site, e a funcao da Vercel
    # recusa corpo acima de ~4,5 MB — a foto seria barrada ANTES de chegar aqui,
    # com um erro que a tela nao controla e nao sabe explicar. Melhor recusar no
    # nosso limite, com mensagem nossa. A API reduz para 1200 px de qualquer
    # forma, entao 4 MB continua sobrando para foto de celular.
    max-bytes: ${FOTO_MAX_BYTES:4194304}
    max-pixels: 40000000   # trava contra bomba de descompressao
    s3:
      bucket: ${FOTO_S3_BUCKET:}
      # "auto" serve para R2. Na AWS, a regiao de verdade.
      regiao: ${FOTO_S3_REGIAO:auto}
      # Vazio usa a AWS. Preenchido, liga path-style e desliga a assinatura
      # em blocos, que nem todo servico compativel aceita.
      endpoint: ${FOTO_S3_ENDPOINT:}
      chave: ${FOTO_S3_CHAVE:}
      segredo: ${FOTO_S3_SEGREDO:}
  admin:
    # Elevacao curta: sessao aberta em computador destravado nao pode virar
    # acesso ao segredo de um lote inteiro.
    validade-reautenticacao: PT5M
    # Promove a ADMIN uma conta que JA existe, na subida. A pessoa se cadastra
    # pelo site escolhendo a propria senha; aqui so muda o papel. Nao cria
    # conta: promover um cadastro inexistente seria abrir um admin fantasma.
    email-inicial: ${ADMIN_EMAIL:}
  transferencia:
    # Curta de proposito: o codigo e um portador, quem o tem vira dono.
    validade: PT15M
  outbox:
    intervalo-ms: 15000

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    br.com.conectapet: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
logging:
  level:
    br.com.conectapet: DEBUG
    org.hibernate.SQL: DEBUG
conectapet:
  cookie:
    # http://localhost nao aceita cookie Secure em alguns navegadores
    seguro: false
  site:
    # Em dev o link precisa abrir no servidor local; com o dominio de producao
    # o e-mail de teste manda a pessoa para fora da maquina.
    url: ${URL_SITE:http://localhost:4321}
  notificacao:
    # Sem provedor de e-mail, o link de redefinir senha nao chega a lugar
    # nenhum. Aqui ele sai no console. So no perfil dev.
    log-conteudo: true
  seed:
    # Gera um lote de 10 tags e imprime os codigos de ativacao no console.
    # So no perfil dev: em qualquer outro isso seria vazamento.
    habilitado: true
    quantidade: 10

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false      # OpenAPI protegido em producao
  swagger-ui:
    enabled: false
conectapet:
  seed:
    habilitado: false
