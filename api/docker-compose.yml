services:
  mysql:
    image: mysql:8.4
    container_name: conectapet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-raiz-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conectapet}
      MYSQL_USER: ${MYSQL_USER:-conectapet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-senha-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dados-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-raiz-local}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dados-mysql:
